name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src:tests python3 -m unittest test_client test_fleet test_sync
        working-directory: sdk/python
  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: sdk/js
